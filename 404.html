<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Hitarthi Arcade</title>
<meta name="robots" content="noindex">
<script>
/* match the homepage: saved choice, else light */
(function () {
  var t = null;
  try { t = localStorage.getItem("arcade-theme"); } catch (e) {}
  if (t !== "dark" && t !== "light") t = "light";
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<link rel="icon" type="image/png" href="/hitarthi-games/assets/hitarthi-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --ink:#0f1729;
    --ink-body:#3d4759;
    --ink-muted:#5b6474;
    --blue:#2563eb;
    --blue-bright:#3b82f6;
    --amber:#f59e0b;
    --teal:#1e6b5e;
    --border:#e2e8f0;
    --paper:#ffffff;
    --card:#ffffff;
    --ring:#ffffff;
    --rule:rgba(37,99,235,.075);
    --margin-line:rgba(245,158,11,.32);
    --shadow-soft:0 10px 24px rgba(15,23,41,.06);
  }
  [data-theme="dark"]{
    color-scheme:dark;
    --ink:#e9eef7;
    --ink-body:#b8c2d8;
    --ink-muted:#8b97af;
    --blue:#7fa8ff;
    --blue-bright:#a3c2ff;
    --teal:#45b8a3;
    --border:#2e3d5f;
    --paper:#0d1526;
    --card:#151f38;
    --ring:#151f38;
    --rule:rgba(255,255,255,.05);
    --margin-line:rgba(245,158,11,.22);
    --shadow-soft:0 10px 24px rgba(0,0,0,.4);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);
    background-color:var(--paper);
    background-image:repeating-linear-gradient(
      to bottom,transparent 0,transparent 35px,var(--rule) 35px,var(--rule) 36px);
    line-height:1.6;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:2rem 1rem;
  }
  body::before{
    content:"";position:fixed;top:0;bottom:0;
    left:clamp(16px,4vw,56px);width:2px;
    background:var(--margin-line);pointer-events:none;
  }
  .card{
    position:relative;
    z-index:1;
    max-width:520px;
    width:100%;
    text-align:center;
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:1.25rem;
    padding:clamp(1.75rem,5vw,2.75rem);
    box-shadow:0 0 0 5px var(--ring),0 0 0 6.5px var(--border),var(--shadow-soft);
    transform:rotate(-.7deg);
  }
  /* washi tape, same as the game stickers on the homepage */
  .card::before{
    content:"";position:absolute;top:-14px;left:50%;
    transform:translateX(-50%) rotate(-2.5deg);
    width:110px;height:26px;
    background:rgba(245,158,11,.28);
    border-radius:2px;
    box-shadow:0 1px 2px rgba(15,23,41,.08);
  }
  .logo{width:56px;height:56px;object-fit:contain;border-radius:50%;margin-bottom:1rem}
  .code{
    font-family:"Kalam",cursive;font-weight:700;
    font-size:3.4rem;line-height:1;color:var(--blue);
  }
  h1{
    font-family:"Outfit",sans-serif;font-weight:700;
    font-size:clamp(1.25rem,4vw,1.6rem);
    margin-top:.35rem;
  }
  .hi{
    font-family:"Kalam",cursive;font-weight:700;
    color:var(--teal);font-size:1.1rem;margin-top:.35rem;
  }
  p.note{margin-top:.9rem;color:var(--ink-body);font-size:.95rem}
  .btn{
    display:inline-block;margin-top:1.5rem;
    background:var(--blue);color:#fff;font-weight:700;font-size:.95rem;
    text-decoration:none;border-radius:999px;padding:.7em 1.6em;
    box-shadow:0 4px 12px rgba(37,99,235,.3);
    transition:background .2s ease,transform .2s ease;
  }
  .btn:hover{background:var(--blue-bright);transform:translateY(-2px)}
  .btn:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
    .btn:hover{transform:none}
  }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/hitarthi-games/assets/hitarthi-logo.png" alt="" width="56" height="56">
    <div class="code">404</div>
    <h1>This page isn't on the board.</h1>
    <p class="hi" lang="hi">यह पन्ना यहाँ नहीं मिला।</p>
    <p class="note">
      The link may be old, or the game may have moved. Sab games ek hi jagah par hain —
      arcade kholiye aur wahan se chuniye.
    </p>
    <a class="btn" href="/hitarthi-games/">← आर्केड पर वापस · Back to the arcade</a>
  </main>
</body>
</html>
